<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documento Markdown</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            line-height: 1.6;
            max-width: 75ch;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        pre,
        code {
            font-family: Consolas, monospace;
        }

        pre {
            padding: 1rem;
            overflow: auto;
            background: #eee;
        }

        blockquote {
            border-left: .25rem solid #777;
            margin-left: 0;
            padding-left: 1rem;
        }

        a {
            color: #0645ad;
        }
    </style>
</head>
<body>
{{content}}
</body>
</html>
